server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/oauth2login?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${비밀번호넣기}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${클라이언트아이디넣기}
            client-secret: ${클라이언트시크릿넣기}
            scope:
              - email
              - profile
